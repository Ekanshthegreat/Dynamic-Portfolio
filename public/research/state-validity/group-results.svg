<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title desc">
<title id="title">More useful decisions overall, less service for high-change agents</title>
<desc id="desc">Apple M5 inference confirmation, 16 agents, base changes 4 per second, 20 paired seeds. No hazard versus survival: aggregate success 5.78 versus 7.66 percent; lower-change group 10.00 versus 15.10 percent; higher-change group 1.56 versus 0.21 percent. These are synthetic-task results.</desc>

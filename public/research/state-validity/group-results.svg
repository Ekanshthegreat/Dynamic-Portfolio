<text x="35" y="59" font-size="13" fill="#555">Apple M5 · 16 agents · base rate 4 changes/s · 20 paired seeds</text>
<rect x="565" y="25" width="12" height="12" fill="#aaa"/><text x="584" y="36" font-size="13">No hazard</text>
<rect x="685" y="25" width="12" height="12" fill="#333"/><text x="704" y="36" font-size="13">Survival</text>
<g stroke="#ddd" stroke-dasharray="2 4"><path d="M65 250H805 M65 190H805 M65 130H805"/></g>
<path d="M65 90V310H805" fill="none" stroke="#666"/>
